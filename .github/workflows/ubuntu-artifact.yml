name: Ubuntu Artifact
on:
  push:
    branches: [ "master" ]
jobs:
  build:
    name: Ubuntu Artifact
    runs-on: ubuntu-latest
    steps:
      - name: Download source
        uses: actions/checkout@v4
      - name: Build project
        run: make
      - name: Package exe
        run: |
          mkdir -p dist
          cp DOOM1.WAD bin
          cp bin/* dist/
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: doo-cr-ubuntu
          path: dist/