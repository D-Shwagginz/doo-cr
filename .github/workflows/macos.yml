name: Macos
on: [push, pull_request]
jobs:
  demos:
    name: Macos Demos
    runs-on: macos-latest
    steps:
      - name: Download source
        uses: actions/checkout@v4
      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: latest
      - name: Install Crystal libs
        run: shards install
      - name: Build project
        run: make
      - name: Run Demos
        run: |
          mv DOOM1.WAD ./bin
          cd bin
          ./doo-cr -playdemo demo1
          ./doo-cr -playdemo demo2
          ./doo-cr -playdemo demo3