name: Ubuntu
on: [push, pull_request]
jobs:
  demos:
    name: Ubuntu Demos
    runs-on: ubuntu-latest
    steps:
      - name: Download source
        uses: actions/checkout@v4
      - name: Build project
        run: make
      - name: Run Demos
        run: |
          mv ./DOOM1.WAD ./bin/
          cd bin
          ./doo-cr -timedemo demo1 -headless -iwad DOOM1.WAD
          ./doo-cr -timedemo demo2 -headless -iwad DOOM1.WAD
          ./doo-cr -timedemo demo3 -headless -iwad DOOM1.WAD